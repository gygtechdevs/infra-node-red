name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  synth:
    name: typecheck + synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx cdk synth --quiet
