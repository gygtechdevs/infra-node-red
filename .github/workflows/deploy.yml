name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  repository_dispatch:
    types: [image-pushed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: node-red
  SERVICES: api-gateway auth-service

jobs:
  deploy:
    name: cdk deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: cdk synth
        run: npx cdk synth --quiet

      - name: cdk diff
        run: npx cdk diff --all || true

      - name: cdk deploy
        run: npx cdk deploy --all --require-approval never --concurrency 2 --outputs-file cdk-outputs.json

      - name: Force new deployment
        run: |
          for svc in $SERVICES; do
            aws ecs update-service --cluster "$CLUSTER_NAME" --service "$svc" \
              --force-new-deployment --region "$AWS_REGION" > /dev/null
          done

      - name: Wait for stable
        run: |
          aws ecs wait services-stable --cluster "$CLUSTER_NAME" \
            --services $SERVICES --region "$AWS_REGION"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Stack outputs"
            echo '```json'
            cat cdk-outputs.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
