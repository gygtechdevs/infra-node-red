name: Deploy infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [image-pushed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: cdk deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: npx cdk synth --quiet

      - name: cdk deploy
        run: npx cdk deploy --all --require-approval never

      - name: Force new deployment
        run: |
          for svc in api-gateway auth-service; do
            aws ecs update-service --cluster nodered-platform --service "$svc" \
              --force-new-deployment --region "$AWS_REGION" > /dev/null
          done

      - name: Wait for stable
        run: |
          aws ecs wait services-stable --cluster nodered-platform \
            --services api-gateway auth-service --region "$AWS_REGION"
